server.port=${PORT:8080}

# Behind Render/Railway's load balancer: trust X-Forwarded-For / -Proto only
# from internal proxy IPs, so getRemoteAddr() is the real client and
# generated gateway URLs use https.
server.forward-headers-strategy=native

# Header holding the real client IP when running behind a proxy/CDN.
# On Render set CLIENT_IP_HEADER=CF-Connecting-IP (Render runs behind Cloudflare).
# Leave empty locally: a client could otherwise fake its IP by sending the header.
app.client-ip-header=${CLIENT_IP_HEADER:}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apigateway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Creates/updates the tables from the entity classes, so a fresh database works.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Redis (rate-limit counters) ---
app.redis.url=${REDIS_URL:redis://localhost:6379}
# What to do if Redis is down: open = allow traffic, closed = reject it
app.ratelimit.fail-policy=${FAIL_POLICY:open}

# --- JWT ---
# No fallback on purpose: the app refuses to start without JWT_SECRET, so a
# deployment can never silently sign tokens with a known key.
# For local runs use the 'local' profile (application-local.properties).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
