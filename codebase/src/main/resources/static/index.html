<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>API Gateway</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F6;--ink:#1B1A17;--mute:#6b665d;--pri:#F25C1F;--acc:#FFD9C7;--ok:#1B1A17;--info:#D9D4C7;--line:rgba(27,26,23,.16);--wash:#F1EEE7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;margin:0;line-height:1}
button,input,select{font:inherit;color:inherit}a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 5vw}
.btn{border:1px solid var(--ink);border-radius:999px;padding:.7rem 1.5rem;background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink)}.btn.sm{padding:.3rem .9rem;font-size:.85rem}
.btn{transition:transform .25s,background .25s,color .25s}.btn:hover{transform:translateY(-2px)}.btn.pri:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}.btn:disabled{opacity:.4}header.nav a.l{background:linear-gradient(var(--pri),var(--pri)) 0 100%/0 2px no-repeat;transition:background-size .3s,color .3s}header.nav a.l:hover{background-size:100% 2px;color:var(--ink)}.panel,.grid .panel{transition:border-color .25s,transform .25s}.grid .panel:hover{border-color:var(--pri);transform:translateY(-3px)}:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
header.nav{position:sticky;top:0;background:rgba(250,249,246,.9);backdrop-filter:blur(10px);z-index:5;border-bottom:1px solid var(--line)}
header.nav .wrap{display:flex;align-items:center;gap:1.6rem;height:68px}
.logo{font:400 1.7rem 'Instrument Serif',serif;text-decoration:none;margin-right:auto}
header.nav a.l{text-decoration:none;color:var(--mute)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:3rem;padding:6vh 0 8vh;align-items:center}
.hero h1{font-size:clamp(3.2rem,9vw,7.4rem);letter-spacing:-.025em}
.hero p{max-width:440px;color:var(--mute);font-size:1.15rem;margin:1.6rem 0 2rem}
.poster{aspect-ratio:4/5;background:var(--wash);border-radius:6px;position:relative;overflow:hidden}
.poster i{position:absolute;bottom:0;display:block}
.sec{padding:7vh 0;border-top:1px solid var(--line)}.sec>.wrap>small{color:var(--mute);display:block;margin-bottom:1rem}
.sec h2{font-size:clamp(2.2rem,5vw,3.6rem);max-width:700px;margin-bottom:3rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:2.4rem}
.col{border-top:1px solid var(--line);padding-top:1rem;position:relative}.col::before{content:'';position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--pri)}.col h3{font-size:2.2rem;margin:.6rem 0}.col p{color:var(--mute)}
.col ul{padding:0;list-style:none;margin:1rem 0 0}.col li{border-top:1px solid var(--line);padding:.45rem 0}
.path{background:var(--wash);border-radius:6px;padding:1.6rem;font:.9rem/1.9 ui-monospace,Menlo,monospace;overflow-x:auto;white-space:pre}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.metrics div{background:var(--bg);padding:1.5rem}.metrics b{font:400 3rem/1 'Instrument Serif',serif;display:block}
footer{background:var(--ink);color:var(--bg);padding:6vh 0}footer h2{font-size:clamp(2rem,5vw,3.4rem)}
.auth{max-width:420px;margin:9vh auto;padding:0 5vw}.auth h1{font-size:3.4rem;margin-bottom:1rem}
label{display:block;font-size:.85rem;color:var(--mute);margin:1rem 0 .3rem}
input,select{width:100%;padding:.7rem 1rem;border-radius:12px;border:1px solid var(--line);background:#fff}
.err{background:var(--acc);border-radius:10px;padding:.55rem .9rem;margin-top:1rem;font-size:.9rem}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{padding:1.5rem 1rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.2rem;background:var(--wash)}
aside a{padding:.55rem 1rem;border-radius:999px;text-decoration:none;cursor:pointer}aside a.on{background:var(--ink);color:var(--bg)}
main{padding:2.2rem 4vw;min-width:0}main h1{font-size:3rem;margin-bottom:1.5rem}
.banner{background:var(--acc);padding:.8rem 1.2rem;border-radius:10px;margin-bottom:1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:1.5rem}
.stats div{background:var(--bg);padding:1.1rem}.stats b{font:400 2.4rem/1.1 'Instrument Serif',serif;display:block}.stats span{color:var(--mute);font-size:.85rem}
.panel{border:1px solid var(--line);border-radius:6px;padding:1.4rem;margin-bottom:1.2rem;background:#fff}.panel h3{font-size:1.7rem;margin-bottom:1rem}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th{text-align:left;color:var(--mute);font-weight:500;padding:.5rem}td{padding:.55rem .5rem;border-top:1px solid var(--line)}
.pill{border-radius:999px;padding:.1rem .7rem;font-size:.8rem;font-weight:600}.pill.ok{background:#E7E3D9}.pill.bl{background:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1rem}.grid .panel{cursor:pointer;margin:0}
.copy{display:flex;gap:.5rem;align-items:center}.copy code,pre{background:var(--wash);padding:.5rem .8rem;border-radius:8px;font-size:.8rem;overflow:auto;flex:1;white-space:pre;margin:0}
.modal{position:fixed;inset:0;background:rgba(27,26,23,.45);display:grid;place-items:center;padding:1rem;z-index:9}.modal form{background:var(--bg);border-radius:8px;padding:1.8rem;width:min(440px,100%);max-height:90vh;overflow:auto}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}.filters select{width:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.leg{display:flex;gap:1rem;font-size:.82rem;color:var(--mute)}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem}
.toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:10px;z-index:20}
@media(max-width:800px){.hero,.two{grid-template-columns:1fr}.shell{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;border:0}header.nav a.l{display:none}}
@media(prefers-reduced-motion:no-preference){
.ln{display:block;overflow:hidden;padding-bottom:.08em}.ln>span{display:block;transform:translateY(110%);animation:ln 1.1s cubic-bezier(.2,.7,.2,1) forwards}.ln:nth-child(2)>span{animation-delay:.12s}.ln:nth-child(3)>span{animation-delay:.24s}@keyframes ln{to{transform:none}}
.late{opacity:0;animation:fade .9s .7s forwards}@keyframes fade{to{opacity:1}}
.poster i{animation:up 1.2s cubic-bezier(.2,.7,.2,1) both}.v1{animation-delay:.2s!important}.v2{animation-delay:.4s!important}.v3{animation-delay:.6s!important}.v4{animation-delay:.1s!important}@keyframes up{from{transform:translateY(100%)}}
.sq{animation:sq 1.4s .9s cubic-bezier(.2,.7,.2,1) both,bob 6s 2.4s ease-in-out infinite!important}@keyframes sq{from{transform:translateX(-160%) rotate(-90deg);opacity:0}}@keyframes bob{50%{transform:translateY(14px)}}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.col::before{transform:scaleX(0);transform-origin:left;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}.col.in::before{transform:scaleX(1)}.col:nth-child(2)::before{transition-delay:.15s}.col:nth-child(3)::before{transition-delay:.3s}
main>*{animation:fade .5s both}.toast,.modal form{animation:pop .3s both}@keyframes pop{from{opacity:0;transform:translateY(10px)}}}
</style></head><body><div id="app"></div>
<script>
/* ===== BACKEND ===== */
// '' = same server that serves this page (Spring Boot). If you host this file
// somewhere else (e.g. Vercel), put the backend URL here, e.g. 'https://your-app.onrender.com'.
const CFG={BASE:''};
let tok=null;try{tok=localStorage.getItem('jwt')}catch(e){}
const setTok=t=>{tok=t;try{t?localStorage.setItem('jwt',t):localStorage.removeItem('jwt')}catch(e){}};
async function req(path,o={}){
 let r;try{r=await fetch(CFG.BASE+path,{method:o.method||'GET',headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:o.body?JSON.stringify(o.body):undefined})}
 catch(e){throw Error('Cannot reach the backend. Check that it is running.')}
 if(r.status===401&&tok){setTok(null);go('login');throw Error('Session expired. Please log in again.')}
 const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){j=t}
 if(!r.ok)throw Error((j&&(j.error||j.message))||'Request failed ('+r.status+')');
 return j}
/* ===== helpers ===== */
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const AL={TOKEN_BUCKET:'Token bucket',SLIDING_WINDOW:'Sliding window'};
const go=r=>location.hash=r;let route=location.hash.slice(1)||'home';
addEventListener('hashchange',()=>{route=location.hash.slice(1)||'home';render()});
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)};
const copyBtn=t=>`<button class="btn ghost sm" onclick="navigator.clipboard.writeText('${t}');toast('Copied')">Copy</button>`;
const logout=()=>{setTok(null);go('home')};

/* ===== public pages ===== */
const navPub=`<header class="nav"><div class="wrap"><a class="logo" href="#home">API Gateway</a><a class="l" href="#features" onclick="document.getElementById('features')?.scrollIntoView();return false">Features</a><a class="l" href="#how" onclick="document.getElementById('how')?.scrollIntoView();return false">How it works</a>${tok?'<a class="btn pri sm" href="#overview">Dashboard</a>':'<a class="btn ghost sm" href="#login">Log in</a><a class="btn sm" href="#signup">Get started</a>'}</div></header>`;
function home(){app.innerHTML=navPub+`<div class="wrap"><section class="hero"><div><h1><span class="ln"><span>Budget</span></span><span class="ln"><span>every request.</span></span><span class="ln"><span>Protect the API.</span></span></h1><p class="late">A self-service rate limiter that sits in front of your existing API. Set a limit per client; the gateway returns 429 when it's spent. Your server stays untouched.</p><a class="btn pri late" href="#signup">Protect your first API</a></div>
<div class="poster" aria-hidden="true"><i class="v1" style="left:6%;width:24%;height:70%;background:var(--ink);border-radius:999px 999px 0 0"></i><i class="v2" style="left:34%;width:30%;height:88%;background:var(--pri)"></i><i class="v3" style="left:68%;width:26%;height:54%;background:var(--info);border-radius:999px 999px 0 0"></i><i class="v4" style="left:0;width:100%;height:10%;background:var(--ink)"></i><i class="sq" style="left:10%;top:9%;bottom:auto;width:16%;aspect-ratio:1;background:var(--pri)"></i></div></section></div>
<section class="sec" id="features"><div class="wrap"><small>01 / Features</small><h2 class="rv">Limit it. See it. Prove it.</h2><div class="cols">
<div class="col"><h3>Limit.</h3><p>Fair, enforceable budgets that stay correct across several gateway instances.</p><ul><li>Token bucket and sliding window</li><li>Atomic counting in Redis</li><li>429 with Retry-After</li><li>Fail-open or fail-closed policy</li></ul></div>
<div class="col"><h3>Observe.</h3><p>Every request is logged with its outcome and who sent it.</p><ul><li>Allowed vs blocked, over time</li><li>Per-API breakdown</li><li>Filterable, paginated request log</li><li>p50 / p95 added latency</li></ul></div>
<div class="col"><h3>Prove.</h3><p>Measure the limiter instead of trusting it.</p><ul><li>Enforcement accuracy load test</li><li>Log completeness</li><li>Algorithm side-by-side</li><li>Redis health and fail policy</li></ul></div></div></div></section>
<section class="sec" id="how"><div class="wrap"><small>02 / How it works</small><h2 class="rv">One hop between client and origin.</h2><div class="path rv">Client  ──key──▶  Gateway (Spring Boot)
                     │ consume-or-reject
                     ▼
              Bucket4j + Redis  ──token?──▶  Target API ──▶ response relayed
                     │ always
                     ▼
              PostgreSQL log  ──▶  This dashboard</div></div></section>
<section class="sec"><div class="wrap"><small>03 / Targets</small><h2 class="rv">Success is measured, not claimed.</h2><div class="metrics rv"><div><b>±2%</b>enforcement accuracy with two instances</div><div><b>≤50 ms</b>p95 added latency</div><div><b>99.9%</b>of requests logged correctly</div><div><b>99%</b>gateway uptime</div></div></div></section>
<footer><div class="wrap rv"><h2>Protect an API in five minutes.</h2><p style="margin:1.5rem 0"><a class="btn pri" href="#signup">Create an account</a></p></div></footer>`}

function auth(s){app.innerHTML=navPub+`<form class="auth" id="f"><h1>${s?'Create your account':'Welcome back'}</h1><label for="e">Email</label><input id="e" type="email" required autocomplete="email"><label for="p">Password</label><input id="p" type="password" required autocomplete="${s?'new-password':'current-password'}"><div id="m"></div><button class="btn pri" style="width:100%;margin-top:1.5rem">${s?'Create account':'Log in'}</button><p style="color:var(--mute);text-align:center">${s?'Have an account? <a href="#login">Log in</a>':'New here? <a href="#signup">Create an account</a>'}</p></form>`;
$('#f').onsubmit=async e=>{e.preventDefault();try{const r=await req(s?'/api/auth/signup':'/api/auth/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value}});setTok(r.token);go('overview')}catch(x){$('#m').innerHTML=`<div class="err">${esc(x.message)}</div>`}}}

/* ===== app ===== */
function shell(t,body){app.innerHTML=`<div class="shell"><aside><a class="logo" href="#home" style="padding:.4rem 1rem 1rem">API Gateway</a>${[['overview','Overview'],['apis','My APIs'],['logs','Request logs'],['lab','Test lab'],['system','System']].map(([k,l])=>`<a class="${t===k?'on':''}" href="#${k}">${l}</a>`).join('')}<a style="margin-top:auto" onclick="logout()">Log out</a></aside><main>${body}</main></div>`}
function chart(d){const W=640,H=200,mx=Math.max(...d.map(x=>x.allowed+x.blocked),1),x=i=>i/(d.length-1)*W,y=v=>H-v/mx*(H-8),L=k=>d.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(k(p)).toFixed(1)}`).join('');
return`<svg viewBox="-20 0 ${W+40} ${H+20}" width="100%" role="img" aria-label="Allowed and blocked requests over 24 hours"><path d="${L(p=>p.allowed)}L${W},${H}L0,${H}Z" fill="#1B1A17" opacity=".12"/><path d="${L(p=>p.allowed)}" fill="none" stroke="#1B1A17" stroke-width="2"/><path d="${L(p=>p.blocked)}L${W},${H}L0,${H}Z" fill="#F25C1F" opacity=".55"/><path d="${L(p=>p.blocked)}" fill="none" stroke="#C84710" stroke-width="2"/>${[0,6,12,18,23].map(h=>`<text x="${x(h)}" y="${H+15}" font-size="11" fill="#6b665d" text-anchor="middle">${new Date(d[h].t).getHours()}:00</text>`).join('')}</svg><div class="leg"><span><i style="background:var(--ok)"></i>Allowed</span><span><i style="background:var(--pri)"></i>Blocked</span></div>`}
const guard=()=>tok||(go('login'),false);

async function overview(){shell('overview','<h1>Overview</h1>');
const [sum,ts,h]=await Promise.all([req('/api/stats/summary'),req('/api/stats/timeseries'),req('/api/system/health')]);
const al=sum.perApi.reduce((n,x)=>n+x.allowed,0),bl=sum.perApi.reduce((n,x)=>n+x.blocked,0),mx=Math.max(...sum.perApi.map(x=>x.allowed+x.blocked),1);
shell('overview',`<h1>Overview</h1>${h.redis!=='UP'?`<div class="banner">Redis is unreachable. The gateway is failing ${h.failPolicy==='open'?'open: requests are passing through unlimited.':'closed: requests are being rejected.'}</div>`:''}
<div class="stats">${[['Total',al+bl],['Allowed',al],['Blocked',bl],['Block rate',(bl/(al+bl||1)*100).toFixed(1)+'%'],['p95 added latency',h.p95+' ms']].map(([l,v])=>`<div><b>${typeof v=='number'?v.toLocaleString():v}</b><span>${l}</span></div>`).join('')}</div>
<div class="panel"><h3>Traffic, last 24 hours</h3>${chart(ts)}</div>
<div class="panel"><h3>By API</h3>${sum.perApi.map(x=>`<div style="margin:.9rem 0"><div style="display:flex;justify-content:space-between"><b>${esc(x.name)}</b><span style="color:var(--mute)">${x.allowed.toLocaleString()} allowed, ${x.blocked.toLocaleString()} blocked</span></div><div style="display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--wash);width:${(x.allowed+x.blocked)/mx*100}%"><span style="flex:${x.allowed};background:var(--ok)"></span><span style="flex:${x.blocked};background:var(--pri)"></span></div></div>`).join('')}</div>`)}

async function apis(){const a=await req('/api/apis');
shell('apis',`<div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:1rem"><h1>My APIs</h1><button class="btn pri" onclick="modal()">Register an API</button></div>${a.length?`<div class="grid">${a.map(x=>`<div class="panel" tabindex="0" onclick="go('api/${x.id}')" onkeydown="if(event.key=='Enter')go('api/${x.id}')"><h3>${esc(x.name)}</h3><p style="color:var(--mute);word-break:break-all;margin:.2rem 0 1rem">${esc(x.targetUrl)}</p><p style="margin:0">${x.limit} requests per ${x.windowSeconds}s · ${AL[x.algorithm]}</p></div>`).join('')}</div>`:'<div class="panel">No APIs yet. Register one to get a gateway endpoint and key.</div>'}`)}

function modal(){const d=document.createElement('div');d.className='modal';d.innerHTML=`<form><h3 style="font-size:2rem">Register an API</h3><label for="n">Name</label><input id="n" required placeholder="WeatherHello"><label for="sl">Short name (appears in your gateway URL)</label><input id="sl" required pattern="[a-z][a-z0-9-]{2,39}" placeholder="weatherhello" title="3-40 lowercase letters, digits or hyphens, starting with a letter"><small id="slp" style="color:var(--mute)"></small><label for="u">Target URL</label><input id="u" type="url" placeholder="https://" required><div class="two"><div><label for="l">Requests allowed</label><input id="l" type="number" min="1" value="100" required></div><div><label for="w">Per (seconds)</label><input id="w" type="number" min="1" value="60" required></div></div><label for="a">Algorithm</label><select id="a"><option value="TOKEN_BUCKET">Token bucket</option><option value="SLIDING_WINDOW">Sliding window</option></select><div id="m"></div><div style="display:flex;gap:.6rem;margin-top:1.4rem"><button class="btn pri">Register</button><button type="button" class="btn ghost" id="x">Cancel</button></div></form>`;
document.body.append(d);d.querySelector('#x').onclick=()=>d.remove();const sl=d.querySelector('#sl'),slp=d.querySelector('#slp'),prev=()=>slp.textContent=sl.value?'Endpoint: '+location.origin+'/g/'+sl.value:'';let edited=false;d.querySelector('#n').oninput=e=>{if(!edited){sl.value=e.target.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^[^a-z]+|-+$/g,'').slice(0,40);prev()}};sl.oninput=()=>{edited=true;prev()};
d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const a=await req('/api/apis',{method:'POST',body:{name:d.querySelector('#n').value,slug:d.querySelector('#sl').value,targetUrl:d.querySelector('#u').value,limit:+d.querySelector('#l').value,windowSeconds:+d.querySelector('#w').value,algorithm:d.querySelector('#a').value}});d.remove();go('api/'+a.id)}catch(x){d.querySelector('#m').innerHTML=`<div class="err">${esc(x.message)}</div>`}}}

async function apiDetail(id){const [x,ts]=await Promise.all([req('/api/apis/'+id),req('/api/stats/timeseries?apiId='+id)]);
shell('apis',`<a href="#apis" style="color:var(--mute)">Back to My APIs</a><h1 style="margin-top:.5rem">${esc(x.name)}</h1>
<div class="panel"><h3>Connect your clients</h3><label>Gateway endpoint</label><div class="copy"><code>${esc(x.gatewayUrl)}</code>${copyBtn(x.gatewayUrl)}</div><label>API key</label><div class="copy"><code>${esc(x.apiKey)}</code>${copyBtn(x.apiKey)}<button class="btn ghost sm" id="rk">Rotate</button></div><label>Example</label><pre>curl ${esc(x.gatewayUrl)} \\\n  -H "X-API-Key: ${esc(x.apiKey)}"\n# over the limit: HTTP 429 + Retry-After</pre></div>
<div class="panel"><h3>Policy</h3><form id="pf"><div class="two"><div><label for="l">Requests allowed</label><input id="l" type="number" min="1" value="${x.limit}"></div><div><label for="w">Per (seconds)</label><input id="w" type="number" min="1" value="${x.windowSeconds}"></div></div><label for="a">Algorithm</label><select id="a"><option value="TOKEN_BUCKET">Token bucket</option><option value="SLIDING_WINDOW">Sliding window</option></select><p><button class="btn pri">Save policy</button></p></form></div>
<div class="panel"><h3>Traffic, last 24 hours</h3>${chart(ts)}</div>
<div class="panel"><h3>Delete this API</h3><p style="color:var(--mute);max-width:600px">Removes the API, its policy and all its request logs. Its gateway URL stops working immediately. This cannot be undone.</p><button class="btn ghost" id="del" style="border-color:#C84710;color:#C84710">Delete API</button></div>`);
$('#a').value=x.algorithm;
$('#del').onclick=async()=>{if(confirm('Delete "'+x.name+'"? Its gateway URL stops working and its logs are erased.')){await req('/api/apis/'+id,{method:'DELETE'});toast('API deleted');go('apis')}};
$('#rk').onclick=async()=>{if(confirm('Clients using the old key will stop working. Rotate it?')){await req(`/api/apis/${id}/rotate-key`,{method:'POST'});apiDetail(id);toast('Key rotated')}};
$('#pf').onsubmit=async e=>{e.preventDefault();await req('/api/apis/'+id,{method:'PUT',body:{limit:+$('#l').value,windowSeconds:+$('#w').value,algorithm:$('#a').value}});toast('Policy saved')}}

async function logs(){const apiList=await req('/api/apis');let st='',ap='',pg=0;const per=10;
const draw=async()=>{const r=await req(`/api/logs?status=${st}&apiId=${ap}&page=${pg}&size=${per}`),pages=Math.max(1,Math.ceil(r.total/per));
shell('logs',`<h1>Request logs</h1><div class="filters"><select id="s" aria-label="Status"><option value="">All outcomes</option><option value="200">Allowed</option><option value="429">Blocked</option></select><select id="p" aria-label="API"><option value="">All APIs</option>${apiList.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
<div class="panel scroll"><table><tr><th>Time</th><th>API</th><th>Client</th><th>Outcome</th><th>Status</th><th>Added latency</th></tr>${r.items.map(l=>`<tr><td>${new Date(l.ts).toLocaleTimeString()}</td><td>${esc(l.apiName)}</td><td>${esc(l.client)}</td><td><span class="pill ${l.outcome=='ALLOWED'?'ok':'bl'}">${l.outcome=='ALLOWED'?'Allowed':'Blocked'}</span></td><td>${l.status??''}</td><td>${l.latencyMs} ms</td></tr>`).join('')||'<tr><td colspan="6">No requests match these filters.</td></tr>'}</table></div>
<div style="display:flex;gap:.8rem;align-items:center"><button class="btn ghost sm" id="pv" ${pg?'':'disabled'}>Previous</button><span>Page ${pg+1} of ${pages}</span><button class="btn ghost sm" id="nx" ${pg<pages-1?'':'disabled'}>Next</button></div>`);
$('#s').value=st;$('#p').value=ap;$('#s').onchange=e=>{st=e.target.value;pg=0;draw()};$('#p').onchange=e=>{ap=e.target.value;pg=0;draw()};$('#pv').onclick=()=>{pg--;draw()};$('#nx').onclick=()=>{pg++;draw()};};draw()}

/* Test lab: enforcement accuracy driver + algorithm comparison */
async function lab(){const a=await req('/api/apis');
shell('lab',`<h1>Test lab</h1><div class="panel"><h3>Enforcement accuracy</h3><p style="color:var(--mute);max-width:620px">Fires many requests at one gateway endpoint from this browser and compares how many were admitted with the configured limit. Target: within ±2%. Tip: give the API a long window (e.g. 100 per 3600 s) so tokens don't refill while the test runs.</p><div class="two"><div><label for="la">API</label><select id="la">${a.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.limit} per ${x.windowSeconds}s)</option>`).join('')}</select></div><div><label for="lm">Requests to send</label><input id="lm" type="number" min="10" value="1000"></div></div><p><button class="btn pri" id="go">Run test</button></p><div id="res"></div></div>
<div class="panel"><h3>Token bucket vs sliding window</h3><p style="color:var(--mute);max-width:620px">The same traffic through both algorithms: a burst of 2N requests, then steady traffic at 1.5x the allowed rate.</p>${cmp()}</div>`);
$('#go').onclick=async()=>{const x=a.find(v=>v.id==$('#la').value),M=+$('#lm').value;$('#res').innerHTML='Running…';let ok=0,bl=0,er=0;
 await Promise.all(Array.from({length:M},async()=>{try{const r=await fetch(x.gatewayUrl,{headers:{'X-API-Key':x.apiKey},redirect:'manual'});if(r.status===429)bl++;else{ok++;if(!r.ok)er++}}catch(e){er++}}))
 const dev=(ok-x.limit)/x.limit*100,pass=Math.abs(dev)<=2;
 $('#res').innerHTML=`<div class="stats"><div><b>${ok}</b><span>Admitted by gateway</span></div><div><b>${bl}</b><span>Blocked (429)</span></div><div><b>${x.limit}</b><span>Configured limit</span></div><div><b>${dev.toFixed(1)}%</b><span>Deviation</span></div><div><b>${er}</b><span>Target errors (of admitted)</span></div></div><span class="pill ${pass?'ok':'bl'}">${pass?'Within ±2%':'Outside ±2%'}</span>`}}
function cmp(){const N=100,W=10,T=30,sim=bucket=>{let tk=N,hist=[],out=[];for(let t=0;t<T;t++){const arr=t===0?2*N:Math.round(1.5*N/W);let adm=0;if(bucket){tk=Math.min(N,tk+N/W);adm=Math.min(arr,Math.floor(tk));tk-=adm}else{const used=hist.slice(-(W-1)).reduce((s,v)=>s+v,0);adm=Math.max(0,Math.min(arr,N-used))}hist.push(adm);out.push(adm)}return out};
const bar=(d,c)=>{const mx=100;return`<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Admitted requests per second">${d.map((v,i)=>`<rect x="${i*10}" y="${110-v/mx*105}" width="8" height="${v/mx*105}" fill="${c}"/>`).join('')}<text x="0" y="119" font-size="9" fill="#6b665d">0s</text><text x="300" y="119" font-size="9" fill="#6b665d" text-anchor="end">${T}s</text></svg>`};
return`<div class="two"><div><b>Token bucket</b>${bar(sim(true),'#F25C1F')}<small style="color:var(--mute)">Allows the burst, then settles at the refill rate.</small></div><div><b>Sliding window</b>${bar(sim(false),'#B9B3A3')}<small style="color:var(--mute)">Spends the budget at once, then waits for the window to slide.</small></div></div>`}

async function system(){const h=await req('/api/system/health');
shell('system',`<h1>System</h1>${h.redis!=='UP'?'<div class="banner">Redis is unreachable. Enforcement is degraded.</div>':''}<div class="stats">${[['Redis',h.redis],['Fail policy',h.failPolicy],['p50 added latency',h.p50+' ms'],['p95 added latency',h.p95+' ms'],['Throughput (last min)',h.throughput+' req/s']].map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
<div class="panel"><h3>When Redis is unreachable</h3><p style="color:var(--mute);max-width:600px">Fail open keeps your API available but unlimited. Fail closed keeps the limit but rejects traffic.</p><select id="fp" style="max-width:260px"><option value="open">Fail open</option><option value="closed">Fail closed</option></select> <button class="btn pri sm" id="sv">Save</button></div>`);
$('#fp').value=h.failPolicy;$('#sv').onclick=async()=>{await req('/api/system/settings',{method:'PUT',body:{failPolicy:$('#fp').value}});toast('Failure policy saved');system()}}

const observe=()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});document.querySelectorAll('.rv,.col').forEach(el=>io.observe(el))};
function render(){const R=route,priv=['overview','apis','logs','lab','system'];
 if((priv.includes(R)||R.startsWith('api/'))&&!guard())return;
 const f=R.startsWith('api/')?()=>apiDetail(R.split('/')[1]):{home,login:()=>auth(0),signup:()=>auth(1),overview,apis,logs,lab,system}[R]||home;
 Promise.resolve(f()).then(observe).catch(e=>toast(e.message)); window.scrollTo(0,0)}
render();
</script></body></html>
